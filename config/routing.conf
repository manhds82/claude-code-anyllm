# Task-aware routing — classify requests by estimated token count.
# Format: tier_name | max_tokens | provider_id
#
# provider_id must match an id in providers.conf.
# Tiers are checked top-to-bottom; first match wins.
# Use "inf" as max_tokens for the catch-all last tier.
#
# Token estimate: ~4 chars = 1 token (good enough for routing decisions).
# Examples:
#   short question / ping          ≈  20–100 tok  → fast
#   normal coding task             ≈ 300–800 tok  → medium
#   architecture review / big diff ≈ 2000+ tok   → heavy

fast   | 500  | groq
medium | 2000 | fpt
heavy  | inf  | gemini
